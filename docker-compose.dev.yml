services:
  card-invitation:
    container_name: card-invitation
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3010:3000"
    restart: unless-stopped
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0 -p 3000"