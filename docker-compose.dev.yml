services:
  caddy:
    environment:
      ROULETTE_UPSTREAM: roulette-physics:5173

  cardinvitation:
    container_name: card-invitation-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3010:3000"
    restart: unless-stopped
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    command: npm run dev -- -H 0.0.0.0 -p 3000

  pic-moment:
    container_name: cardinvitation-pic-moment-dev
    build:
      context: ../pic-moment
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    volumes:
      - ../pic-moment:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    command: npm run dev -- --hostname 0.0.0.0 --port 3000

  roulette-physics:
    build:
      context: ../roulette-physics
      dockerfile: Dockerfile
    ports: !override
      - "5173:5173"
    restart: unless-stopped
    volumes: !override
      - ../roulette-physics:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: npm run dev -- --host 0.0.0.0 --port 5173
