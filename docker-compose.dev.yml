services:
  cardinvitation:
    container_name: card-invitation-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3010:3000"
    restart: unless-stopped
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    command: npm run dev -- -H 0.0.0.0 -p 3000
