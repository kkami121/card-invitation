services:
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: cardinvitation-duckdns
    restart: unless-stopped
    environment:
      PUID: ${DUCKDNS_PUID:-1000}
      PGID: ${DUCKDNS_PGID:-1000}
      TZ: ${TZ:-Asia/Seoul}
      SUBDOMAINS: ${DUCKDNS_SUBDOMAINS:-card-invitation}
      TOKEN: ${DUCKDNS_TOKEN:-}
      LOG_FILE: "false"
    volumes:
      - duckdns_config:/config

  caddy:
    image: caddy:2-alpine
    container_name: cardinvitation-caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-card-invitation.duckdns.org}
      HOST_IP: ${HOST_IP:-127.0.0.1}
      ACME_EMAIL: ${ACME_EMAIL:-}
      WAITING_ROOM_PATH: ${WAITING_ROOM_PATH:-/__waiting_disabled__}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - cardinvitation

  cardinvitation:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: card-invitation
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    command: npm run start -- -H 0.0.0.0 -p 3000
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads

volumes:
  duckdns_config:
  caddy_data:
  caddy_config:
